name: Build Android APK & AAB (Capacitor + Daily Text Widget)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version Android (ex: 3.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    name: Build Debug APK, Release APK & Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install

      - name: Sync www/ and generate Capacitor Android project with Widget
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
        run: |
          if [[ "$ANDROID_VERSION_NAME" == "main" || "$ANDROID_VERSION_NAME" == "master" ]]; then
            export ANDROID_VERSION_NAME="3.0.${{ github.run_number }}"
          else
            export ANDROID_VERSION_NAME="${ANDROID_VERSION_NAME#v}"
          fi
          node scripts/sync-www.js
          npx cap add android
          node scripts/apply-android-widget.js
          npx cap sync android

      - name: Configure Release Keystore (Secret or CI fallback keystore)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Aucun secret ANDROID_KEYSTORE_BASE64 détecté : génération d'un keystore de signature CI."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/android/app/ci-release.keystore" \
              -storepass dfwol-ci-keystore \
              -keypass dfwol-ci-keystore \
              -alias dfwol-ci \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=DFWol, OU=Mobile, O=DFWol, L=Paris, S=IDF, C=FR"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/ci-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=dfwol-ci-keystore" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=dfwol-ci" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=dfwol-ci-keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Debug APK, Release APK, and Release AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Collect APK & AAB artifacts
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/DFWol-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/DFWol-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist-android/DFWol-release.aab
          ls -lh dist-android/

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dfwol-android-apk-aab
          path: dist-android/*

      - name: Publish GitHub Release on Tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-android/DFWol-debug.apk
            dist-android/DFWol-release.apk
            dist-android/DFWol-release.aab
          generate_release_notes: true
